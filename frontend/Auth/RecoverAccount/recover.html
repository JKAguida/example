<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKApp - Recuperar Cuenta</title>
    <link rel="stylesheet" href="../../shared/app.css">
    <link rel="stylesheet" href="recover.css">
</head>

<body>
    <main class="main flex-center">
        <div class="spinner" id="spinner"></div>
        <form class="form" id="form">
            <h1 class="heading">Recupera tu cuenta en <strong>JKApp</strong></h1>
            <p>Ingresa tu email para solicitar un cambio de contraseña y recuperar tu cuenta.</p>

            <div class="form__campo">
                <label for="email" class="form__campo--label">Email</label>
                <input type="email" name="email" id="email" class="form__campo--iemail"
                    placeholder="Ej. juan@gmail.com">
            </div>

            <div class="form__campo">
                <button class="btn form__btn--primary" id="recover-btn">Solicitar cambio de contraseña</button>
            </div>

            <div class="form__links flex-center">
                <a href="../Register/register.html" class="form__links--link">¿No tienes una cuenta?
                    <strong>Registrate</strong></a>
                <a href="../Login/login.html" class="form__links--link">¿Ya tienes una cuenta? <strong>Inicia
                        Sesión</strong></a>

            </div>
        </form>
    </main>
    <script src="recover.js" type="module"></script>
</body>

</html>
