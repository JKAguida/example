<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKApp - Cambio de Contraseña</title>
    <link rel="stylesheet" href="../../shared/app.css">
    <link rel="stylesheet" href="reset-password.css">
</head>

<body>
    <main class="main flex-center">
        <div class="spinner hidden" id="spinner"></div>
        <div class="confirm-container flex-center" id="confirm-container">
            <h1 class="heading">JK<strong>App</strong></h1>
            <p class="confirm-msg" id="confirm-msg">Confirmando la cuenta...</p>
        </div>
        <form class="form hidden" id="form">
            <h1 class="heading">Cambia tu contraseña en <strong>JKApp</strong></h1>
            <div class="form__campo">
                <label for="rawPassword" class="form__campo--label">Nueva Contraseña</label>
                <input type="password" name="rawPassword" id="rawPassword" class="form__campo--ipwd"
                    placeholder="Ej. ********">
            </div>

            <div class="form__campo">
                <label for="rawPasswordRepeat" class="form__campo--label">Confirma la contraseña</label>
                <input type="password" name="rawPasswordRepeat" id="rawPasswordRepeat" class="form__campo--ipwd"
                    placeholder="Ej. ********">
            </div>
            <div class="form__campo">
                <button class="btn form__btn--primary" id="reset-pwd-btn">Cambiar contraseña</button>
            </div>
            <div class="form__links flex-center">
                <a href="../Login/login.html" class="form__links--link">¿Ya tienes una cuenta? <strong>Inicia Sesión</strong></a>
            </div>
        </form>
    </main>
    <script src="reset-password.js" type="module" ></script>
</body>

</html>
